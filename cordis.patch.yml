# dsh-blender-preview bundle patch: mount the host half, which resolves Blender
# and exports a cached GLB from a .blend file. The browser half — the right
# sidebar tab and the WebGL viewport — is mounted by the `dsh.client` entry in
# package.json, not from here.
#
# `name` MUST be the published package name, because the loader imports this
# exact specifier. `id` is this row's storage/effect key: once released, do not
# rename it, or saved user state is orphaned.
- insert:
    - id: blender-preview
      name: 'dsh-blender-preview'
